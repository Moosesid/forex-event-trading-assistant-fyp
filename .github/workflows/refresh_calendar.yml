name: Refresh ForexFactory Calendar

on:
  schedule:
    # Runs every hour, at minute 5
    - cron: '5 * * * *'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cloudscraper beautifulsoup4

      - name: Run scraper
        run: python scrape_calendar.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ff_calendar.json
          git diff --staged --quiet || git commit -m "Auto-refresh ff_calendar.json [skip ci]"
          git push
